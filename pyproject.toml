[project]
name = "proton-mcp"
version = "0.1.0"
description = "Local MCP server for Proton Mail over Proton Bridge"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "imapclient>=3.0.0",
]

[project.scripts]
proton-mcp = "proton_mcp.server:main"
proton-mcp-auth = "proton_mcp.auth_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proton_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["proton_mcp"]

# These libraries don't ship a py.typed marker; trust them at the boundary.
[[tool.mypy.overrides]]
module = ["imapclient.*", "mcp.*"]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_decorators = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
